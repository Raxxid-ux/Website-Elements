<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Text Cleaner Pro</title><style>body{font:16px system-ui;max-width:1000px;margin:32px auto;padding:0 16px;background:#f4f6ff;color:#17213b}h1{margin-bottom:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #dce3f2;border-radius:16px;padding:18px}textarea{width:100%;height:300px;box-sizing:border-box;padding:12px;border:1px solid #ccd5e5;border-radius:10px;font:14px/1.5 monospace}label{display:block;margin:10px 0}button{padding:10px 14px;border:0;border-radius:9px;background:#315efb;color:white;cursor:pointer;margin:4px}button.secondary{background:#e5eaf7;color:#24345c}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Advanced Text Cleaner Pro</h1><p>Clean and normalize text in your browser.</p><div class="grid"><section class="card"><h2>Original text</h2><textarea id="input" placeholder="Paste text here"></textarea><p id="inputStats"></p><button id="sample" class="secondary">Load sample</button></section><section class="card"><h2>Clean result</h2><textarea id="output" readonly></textarea><p id="outputStats"></p><button id="copy">Copy result</button><button id="download" class="secondary">Download TXT</button></section></div><section class="card"><h2>Cleanup options</h2><label><input type="checkbox" id="trim" checked> Trim spaces at line ends</label><label><input type="checkbox" id="spaces" checked> Replace repeated spaces</label><label><input type="checkbox" id="blank" checked> Reduce repeated blank lines</label><label><input type="checkbox" id="zero" checked> Remove zero-width characters</label><label><input type="checkbox" id="tabs" checked> Convert tabs to spaces</label><label><input type="checkbox" id="quotes"> Normalize curly quotes</label><label><input type="checkbox" id="dashes"> Normalize dash characters</label><label><input type="checkbox" id="empty"> Remove empty lines</label><label for="remove">Remove specific text (optional)</label><input id="remove" style="width:min(100%,500px);padding:9px"><p><button id="clean">Clean text</button><button id="reset" class="secondary">Reset</button></p><p>Text is processed locally in this page. Review the result before using it.</p></section><script>const $=id=>document.getElementById(id),input=$('input'),output=$('output');function stats(t){return t.length+' characters · '+(t.trim()?t.trim().split(/\s+/).length:0)+' words'}function clean(){let t=input.value;if($('zero').checked)t=t.replace(/[\u200B-\u200D\uFEFF\u2060]/g,'');if($('tabs').checked)t=t.replace(/\t/g,'  ');if($('trim').checked)t=t.split(/\r?\n/).map(s=>s.trim()).join('\n');if($('spaces').checked)t=t.split('\n').map(s=>s.replace(/ {2,}/g,' ')).join('\n');if($('blank').checked)t=t.replace(/\n[ \t]*\n(?:[ \t]*\n)+/g,'\n\n');if($('empty').checked)t=t.split('\n').filter(s=>s.trim()).join('\n');if($('quotes').checked)t=t.replace(/[“”„]/g,'"').replace(/[‘’‚]/g,"'");if($('dashes').checked)t=t.replace(/[‐‑‒–—―]/g,'-');if($('remove').value)t=t.split($('remove').value).join('');output.value=t;$('inputStats').textContent=stats(input.value);$('outputStats').textContent=stats(t)}$('clean').onclick=clean;input.oninput=clean;document.querySelectorAll('input[type=checkbox],#remove').forEach(e=>e.addEventListener('input',clean));$('sample').onclick=()=>{input.value='  Hello   world!\n\n\nThis is a sample text.\tWith extra spaces.  \n“Curly quotes” and — long dashes.';clean()};$('reset').onclick=()=>{input.value='';output.value='';$('remove').value='';clean()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(output.value);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy result',1000)}catch{output.select();document.execCommand('copy')}};$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([output.value],{type:'text/plain;charset=utf-8'}));a.download='cleaned-text.txt';a.click();URL.revokeObjectURL(a.href)};clean();</script></body></html>
